name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compilar y empaquetar
        run: mvn package -DskipTests

      - name: Extraer version
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Subir JAR como artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangout-service
          path: target/*.jar

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: hangout-service

      - name: Ejecutar tests unitarios
        run: mvn test jacoco:check

      - name: Publicar reporte de tests unitarios
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hangoutdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: hangout-service

      - name: Ejecutar tests de integracion
        run: mvn failsafe:integration-test failsafe:verify

      - name: Publicar reporte de tests de integracion
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/failsafe-reports/TEST-*.xml'

  package:
    name: Package Docker Image
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.event_name == 'pull_request'
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: hangout-service

      - name: Construir imagen Docker
        run: docker build -t hangout-service:${{ needs.build.outputs.version }} .

      - name: Guardar imagen como artifact
        run: docker save hangout-service:${{ needs.build.outputs.version }} -o /tmp/hangout-image.tar

      - name: Subir imagen como artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangout-image
          path: /tmp/hangout-image.tar

  deploy:
    name: Deploy to Azure
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar aplicacion
        run: |
          echo "⏳ Deploy pendiente - configurar Azure Resource Group"
          # Reemplazar con el comando de deploy cuando tengan el resource group
          # curl -X POST ${{ secrets.DEPLOY_HOOK }}
