name: CD - Deploy a Azure

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, test-pipeline]

jobs:
  deploy:
    name: Deploy a Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar JAR sin tests
        run: mvn package -DskipTests

      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar JAR a App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          package: target/*.jar

      - name: Mostrar URLs del servicio
        run: |
          APP_NAME="${{ secrets.AZURE_APP_SERVICE_NAME }}"
          echo "✅ Despliegue completado"
          echo "API:     https://${APP_NAME}.azurewebsites.net"
          echo "Swagger: https://${APP_NAME}.azurewebsites.net/swagger-ui/index.html"
