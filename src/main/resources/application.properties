spring.application.name=hangout-service

# PostgreSQL — Azure App Service env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hangoutdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Scheduling
spring.task.scheduling.pool.size=2

# RabbitMQ — broker connection (CloudAMQP / Azure)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# Exchange and routing keys
rabbitmq.exchange.hangout=${RABBITMQ_EXCHANGE_HANGOUT:hangout.events}
rabbitmq.routing-key.parche-created=${RABBITMQ_RK_PARCHE_CREATED:parche.created}
rabbitmq.routing-key.invitation-sent=${RABBITMQ_RK_INVITATION_SENT:invitation.sent}
rabbitmq.routing-key.invitation-accepted=${RABBITMQ_RK_INVITATION_ACCEPTED:invitation.accepted}
rabbitmq.routing-key.member-joined=${RABBITMQ_RK_MEMBER_JOINED:member.joined}
rabbitmq.routing-key.invitation-rejected=${RABBITMQ_RK_INVITATION_REJECTED:invitation.rejected}
rabbitmq.routing-key.parche-dissolved=${RABBITMQ_RK_PARCHE_DISSOLVED:parche.dissolved}
rabbitmq.routing-key.member-left=${RABBITMQ_RK_MEMBER_LEFT:member.left}

# External service URLs — notification integration pending
# services.gamification.url=${GAMIFICATION_SERVICE_URL:http://localhost:8082}
# services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# OpenFeign — external microservices (stubs: empty URL = fallback devuelve lista vacía)
services.places.url=${PLACES_SERVICE_URL:}
services.categories.url=${CATEGORIES_SERVICE_URL:}
services.events.url=${EVENTS_SERVICE_URL:}

# Actuator
management.endpoint.health.show-details=always

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
