spring.application.name=hangout-service

# PostgreSQL - Railway provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:hangoutdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Scheduling
spring.task.scheduling.pool.size=2

# RabbitMQ — configurar via Azure App Service env vars
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:true}

# Exchange and routing keys — must match notification-service and gamification-service config
rabbitmq.exchange.hangout=hangout.events
rabbitmq.routing-key.invitation-sent=invitation.sent
rabbitmq.routing-key.invitation-accepted=invitation.accepted
rabbitmq.routing-key.member-joined=member.joined

# External service URLs — set these in Azure App Service environment variables
# Pattern: each microservice this service calls gets its own variable
# (hangout-service currently communicates async via RabbitMQ, but kept here for future REST calls)
services.gamification.url=${GAMIFICATION_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# JWT — firma de tokens (configurar via Azure App Service env vars)
jwt.secret=a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
jwt.expiration=${JWT_EXPIRATION:2592000000}

# Actuator
management.endpoint.health.show-details=always