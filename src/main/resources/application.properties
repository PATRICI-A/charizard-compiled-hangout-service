spring.application.name=hangout-service

# PostgreSQL - Railway provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hangoutdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Scheduling
spring.task.scheduling.pool.size=2

# RabbitMQ — credentials come from Azure App Service environment variables
# CloudAMQP uses SSL (amqps://) → set RABBITMQ_SSL=true and RABBITMQ_PORT=5671 in Azure
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:true}

# External service URLs — set these in Azure App Service environment variables
# Pattern: each microservice this service calls gets its own variable
# (hangout-service currently communicates async via RabbitMQ, but kept here for future REST calls)
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.gamification.url=${GAMIFICATION_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}
