spring.application.name=hangout-service

# H2 Database (dev)
spring.datasource.url=jdbc:h2:mem:hangoutdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,HOUR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (disabled for dev - H2 incompatibility with PostgreSQL functions)
spring.flyway.enabled=false

# Data initialization (seed data)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Server
server.port=8080

# Scheduling
spring.task.scheduling.pool.size=2
