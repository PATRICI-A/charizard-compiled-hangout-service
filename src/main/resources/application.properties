spring.application.name=hangout-service

# PostgreSQL — Azure App Service env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hangoutdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Scheduling
spring.task.scheduling.pool.size=2

# RabbitMQ — disabled while notification-service integration is pending
# spring.rabbitmq.host=${RABBITMQ_HOST}
# spring.rabbitmq.port=${RABBITMQ_PORT:5671}
# spring.rabbitmq.username=${RABBITMQ_USERNAME}
# spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
# spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:true}

# Exchange and routing keys — disabled (notification integration pending)
# rabbitmq.exchange.hangout=hangout.events
# rabbitmq.routing-key.invitation-sent=invitation.sent
# rabbitmq.routing-key.invitation-accepted=invitation.accepted
# rabbitmq.routing-key.member-joined=member.joined

# Disable RabbitMQ autoconfiguration to avoid startup failure without broker
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration

# External service URLs — disabled (notification integration pending)
# services.gamification.url=${GAMIFICATION_SERVICE_URL:http://localhost:8082}
# services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# JWT — same secret as auth-service
jwt.secret=${JWT_SECRET:P4tric1A-Auth-S3rv1c3-S3cr3t-K3y-2026!!}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# Actuator
management.endpoint.health.show-details=always

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
